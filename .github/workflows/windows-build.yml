name: Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run image, automation and configuration checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('DetectionChecks', 'JoinedScreenChecks', 'AutomationChecks', 'ConfigurationChecks')) {
            dotnet run --project "tests/$name/$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Checks failed: $name" }
          }
      - name: Build desktop platform checks
        shell: pwsh
        run: |
          dotnet build tests/PlatformChecks/PlatformChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Platform check build failed' }
      - name: Publish Windows x64 EXEs with and without runtime
        shell: pwsh
        run: |
          ./build.ps1
          foreach ($variant in @('with-runtime', 'without-runtime')) {
            if (!(Test-Path "dist/WardogsTeamselector-win-x64-$variant.exe")) { throw "Published EXE missing: $variant" }
          }
      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: WardogsTeamselector-win-x64
          path: dist/WardogsTeamselector-win-x64-*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: windows-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: WardogsTeamselector-win-x64
          path: dist
      - name: Validate changelog generation
        run: python3 .github/scripts/test_release.py
      - name: Publish release with changelog and both EXEs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py
