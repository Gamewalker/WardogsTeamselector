name: Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run image, automation and configuration checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('DetectionChecks', 'JoinedScreenChecks', 'AutomationChecks', 'ConfigurationChecks')) {
            dotnet run --project "tests/$name/$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Checks failed: $name" }
          }
      - name: Build desktop platform checks
        shell: pwsh
        run: |
          dotnet build tests/PlatformChecks/PlatformChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Platform check build failed' }
      - name: Publish portable Windows x64 EXE
        shell: pwsh
        run: |
          ./build.ps1
          if (!(Test-Path 'dist/WardogsTeamselector.exe')) { throw 'Published EXE missing' }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WardogsTeamselector-win-x64
          path: dist/WardogsTeamselector.exe
          if-no-files-found: error
          retention-days: 30
