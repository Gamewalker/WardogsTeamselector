name: Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run image, automation and configuration checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('DetectionChecks', 'JoinedScreenChecks', 'AutomationChecks', 'ConfigurationChecks', 'LocalizationChecks', 'UpdateChecks', 'GroupChecks', 'GroupStorageChecks')) {
            dotnet run --project "tests/$name/$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Checks failed: $name" }
          }
      - name: Build desktop platform checks
        shell: pwsh
        run: |
          dotnet build tests/PlatformChecks/PlatformChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Platform check build failed' }
      - name: Publish Windows x64 EXEs with and without runtime
        shell: pwsh
        run: |
          ./build.ps1 -ReleaseBuild ${{ github.run_number }}
          foreach ($variant in @('with-runtime', 'without-runtime')) {
            if (!(Test-Path "dist/WardogsTeamselector-win-x64-$variant.exe")) { throw "Published EXE missing: $variant" }
          }
      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: WardogsTeamselector-win-x64
          path: dist/WardogsTeamselector-win-x64-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Check desktop UI and group fixtures without game inputs
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts/group-ui-smoke'
          $exe = Join-Path $PWD 'dist/WardogsTeamselector-win-x64-with-runtime.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--ui-smoke', ('"' + $output + '"')) -PassThru
          if (!$process.WaitForExit(180000)) { $process.Kill(); throw 'UI smoke timed out' }
          $result = Join-Path $output 'result.txt'
          if (!(Test-Path $result)) { throw 'UI smoke produced no result' }
          $message = Get-Content -Raw $result
          if ($process.ExitCode -ne 0 -or $message.Trim() -ne 'GUI smoke passed') {
            @('### Group UI smoke failure', '```text', $message, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw $message
          }
      - name: Upload desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WardogsTeamselector-group-ui
          path: artifacts/group-ui-smoke/
          if-no-files-found: ignore
          retention-days: 14

  groups-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run test:client
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'

  release:
    needs: [build, groups-backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: windows-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: WardogsTeamselector-win-x64
          path: dist
      - name: Validate changelog generation
        run: python3 .github/scripts/test_release.py
      - name: Publish release with changelog and both EXEs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py
